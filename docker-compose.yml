services:
  business:
    build:
      context: ./business
      dockerfile: Dockerfile
    container_name: azmigrantat-business
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_DRIVER: mysql
      DB_HOST: business-mysql
      DB_PORT: 3306
      DB_NAME: ${BUSINESS_MYSQL_DATABASE:-business}
      DB_USER: ${BUSINESS_MYSQL_USER:-business}
      DB_PASS: ${BUSINESS_MYSQL_PASSWORD:-business}
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      DATABASE_ADMIN_EMAIL: ${BUSINESS_DATABASE_ADMIN_EMAIL:-admin@localhost}
      DATABASE_ADMIN_PASSWORD: ${BUSINESS_DATABASE_ADMIN_PASSWORD:-admin}
      ETOME_APP_SERVER_URL: ${BUSINESS_APP_SERVER_URL:-http://localhost:8090}
      AUTH_SERVER_URL: http://auth:8080
      OAUTH_SERVER_URL: ${BUSINESS_OAUTH_SERVER_URL:-http://localhost:8081}
      OAUTH_INTERNAL_SERVER_URL: ${BUSINESS_OAUTH_INTERNAL_SERVER_URL:-http://auth:8080}
      OAUTH_CLIENT_ID: ${BUSINESS_OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${BUSINESS_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${BUSINESS_OAUTH_REDIRECT_URI:-http://localhost:8090/auth/callback}
    ports:
      - "${BUSINESS_PORT:-8090}:8080"
    volumes:
      - ./business/storage:/var/www/business/storage
      - ./business/public/uploads:/var/www/business/public/uploads
    depends_on:
      business-mysql:
        condition: service_healthy
      auth:
        condition: service_started

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: azmigrantat-auth
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_TEST_MODE: "true"
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-auth}
      DB_USER: ${MYSQL_USER:-auth}
      DB_PASS: ${MYSQL_PASSWORD:-auth}
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      DATABASE_ADMIN_EMAIL: ${DATABASE_ADMIN_EMAIL:-admin@localhost}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD:-admin}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-local-migration-password}
      ETOME_BASE_URL: ${ETOME_BASE_URL:-http://localhost:8080}
      REALTIME_SERVER_URL: http://realtime:3001
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-local-realtime-secret}
    ports:
      - "${AUTH_PORT:-8081}:8080"
    volumes:
      - ./auth/storage:/var/www/auth/storage
    depends_on:
      mysql:
        condition: service_healthy
      realtime:
        condition: service_started

  realtime:
    build:
      context: ./app/azmigrantat-realtime
      dockerfile: Dockerfile
    container_name: azmigrantat-realtime
    restart: unless-stopped
    environment:
      PORT: 3001
      PHP_API_URL: http://auth:8080
      INTERNAL_API_SECRET: ${REALTIME_INTERNAL_SECRET:-local-realtime-secret}
      REDIS_URL: redis://redis:6379
      MEDIA_NODE_INTERNAL_SECRET: ${MEDIA_NODE_INTERNAL_SECRET:-local-media-node-secret}
      FCM_ENABLED: "false"
      REALTIME_CORS_ORIGINS: ${REALTIME_CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
    ports:
      - "${REALTIME_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy

  media-node-1:
    build:
      context: ./app/azmigrantat-media-node
      dockerfile: Dockerfile
    container_name: azmigrantat-media-node-1
    restart: unless-stopped
    environment:
      MEDIA_NODE_ID: media-node-1
      MEDIA_NODE_HOST: 0.0.0.0
      MEDIA_NODE_PORT: 3002
      MEDIA_NODE_ADVERTISED_HOST: ${MEDIA_NODE_ADVERTISED_HOST:-localhost}
      MEDIA_NODE_CONTROL_HOST: media-node-1
      MEDIA_NODE_INTERNAL_SECRET: ${MEDIA_NODE_INTERNAL_SECRET:-local-media-node-secret}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40099
      REDIS_URL: redis://redis:6379
      MEDIA_NODE_HEARTBEAT_INTERVAL_MS: 5000
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${MEDIA_NODE_PORT:-3002}:3002"
      - "${MEDIA_NODE_RTC_MIN_PORT:-40000}-${MEDIA_NODE_RTC_MAX_PORT:-40099}:40000-40099/udp"

  redis:
    image: redis:8-alpine
    container_name: azmigrantat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - azmigrantat_redis_data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: azmigrantat-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://auth:8080
    depends_on:
      auth:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: azmigrantat-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auth}
      MYSQL_USER: ${MYSQL_USER:-auth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auth}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - azmigrantat_auth_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20

  business-mysql:
    image: mysql:8.4
    container_name: azmigrantat-business-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BUSINESS_MYSQL_ROOT_PASSWORD:-business-root}
      MYSQL_DATABASE: ${BUSINESS_MYSQL_DATABASE:-business}
      MYSQL_USER: ${BUSINESS_MYSQL_USER:-business}
      MYSQL_PASSWORD: ${BUSINESS_MYSQL_PASSWORD:-business}
    ports:
      - "${BUSINESS_MYSQL_PORT:-3308}:3306"
    volumes:
      - azmigrantat_business_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20

  business-phpmyadmin:
    image: phpmyadmin:5.2
    container_name: azmigrantat-business-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: business-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
    ports:
      - "${BUSINESS_PHPMYADMIN_PORT:-8084}:80"
    depends_on:
      business-mysql:
        condition: service_healthy

volumes:
  azmigrantat_auth_mysql_data:
  azmigrantat_business_mysql_data:
  azmigrantat_redis_data:
