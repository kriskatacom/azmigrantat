services:
  mysql:
    image: mysql:8.4
    container_name: azmigrantat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-azmigrantat}
      MYSQL_USER: ${MYSQL_USER:-azmigrantat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-azmigrantat}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - azmigrantat_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  azmigrantat_mysql_data:
